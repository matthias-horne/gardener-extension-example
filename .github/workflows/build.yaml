name: Build

on:
  pull_request:
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - run: make build
    - run: make test
    - uses: azure/setup-helm@v4.3.1
    - run: helm lint charts/gardener-extension-example
