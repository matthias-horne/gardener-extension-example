name: Build

on:
  pull_request:
  push:
    branches:
    - main
  release:
    types:
    - published

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - run: make build
    - run: make test
    - uses: azure/setup-helm@v4.3.1
    - run: helm lint charts/gardener-extension-example
    - run: helm lint charts/gardener-extension-admission-example/charts/runtime
    - run: helm lint charts/gardener-extension-admission-example/charts/application

  publish:
    needs: build
    # Pull requests from forks only get a read-only token and cannot push packages.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      ADMISSION_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gardener-extension-admission-example
      CHART_NAME: gardener-extension-example
      ADMISSION_RUNTIME_CHART_NAME: admission-example-runtime
      ADMISSION_VIRTUAL_CHART_NAME: admission-example-application
      CHART_REPOSITORY: ghcr.io/${{ github.repository_owner }}/charts
      EXTENSION_REPOSITORY: ghcr.io/${{ github.repository_owner }}/extensions
    steps:
    - uses: actions/checkout@v5

    - name: Determine tags
      id: tags
      uses: ./.github/actions/push-tags

    - name: Determine container tags
      id: container_tags
      shell: bash
      env:
        CONTAINER_TAG: ${{ steps.tags.outputs.container_tag }}
      run: |
        image_tags="${IMAGE_NAME}:${CONTAINER_TAG}"
        admission_image_tags="${ADMISSION_IMAGE_NAME}:${CONTAINER_TAG}"
        if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
          image_tags="${image_tags}"$'\n'"${IMAGE_NAME}:latest"
          admission_image_tags="${admission_image_tags}"$'\n'"${ADMISSION_IMAGE_NAME}:latest"
        fi
        {
          echo "image_tags<<EOF"
          echo "${image_tags}"
          echo "EOF"
          echo "admission_image_tags<<EOF"
          echo "${admission_image_tags}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push extension image
      uses: docker/build-push-action@v6
      with:
        context: .
        target: gardener-extension-example
        push: true
        tags: ${{ steps.container_tags.outputs.image_tags }}

    - name: Build and push admission image
      uses: docker/build-push-action@v6
      with:
        context: .
        target: gardener-extension-admission-example
        push: true
        tags: ${{ steps.container_tags.outputs.admission_image_tags }}

    - name: Set up Helm
      uses: azure/setup-helm@v4.3.1

    - name: Patch chart image values
      shell: bash
      env:
        CONTAINER_TAG: ${{ steps.tags.outputs.container_tag }}
      run: |
        yq eval -i '
          .image.repository = strenv(IMAGE_NAME) |
          .image.tag = strenv(CONTAINER_TAG)
        ' "charts/${CHART_NAME}/values.yaml"
        yq eval -i '
          .image.repository = strenv(ADMISSION_IMAGE_NAME) |
          .image.tag = strenv(CONTAINER_TAG)
        ' charts/gardener-extension-admission-example/charts/runtime/values.yaml

    - name: Package and push Helm charts
      shell: bash
      env:
        HELM_TAG: ${{ steps.tags.outputs.helm_tag }}
        APP_VERSION: ${{ steps.tags.outputs.container_tag }}
      run: |
        printf '%s' "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
          --username "${{ github.actor }}" \
          --password-stdin
        for chart in \
          "charts/${CHART_NAME}" \
          charts/gardener-extension-admission-example/charts/runtime \
          charts/gardener-extension-admission-example/charts/application; do
          helm package "${chart}" \
            --version "${HELM_TAG}" \
            --app-version "${APP_VERSION}" \
            --destination "${RUNNER_TEMP}"
          chart_name="$(yq eval '.name' "${chart}/Chart.yaml")"
          helm push "${RUNNER_TEMP}/${chart_name}-${HELM_TAG}.tgz" \
            "oci://${CHART_REPOSITORY}"
        done

    - name: Create compatibility artifacts
      uses: matthias-horne/extension-hub/.github/actions/compatibility@main
      with:
        chart-ref: ${{ env.CHART_REPOSITORY }}/${{ env.CHART_NAME }}:${{ steps.tags.outputs.helm_tag }}
        admission-runtime-chart-ref: ${{ env.CHART_REPOSITORY }}/${{ env.ADMISSION_RUNTIME_CHART_NAME }}:${{ steps.tags.outputs.helm_tag }}
        admission-virtual-chart-ref: ${{ env.CHART_REPOSITORY }}/${{ env.ADMISSION_VIRTUAL_CHART_NAME }}:${{ steps.tags.outputs.helm_tag }}
        extension-ref: ${{ env.EXTENSION_REPOSITORY }}/${{ env.CHART_NAME }}:${{ steps.tags.outputs.container_tag }}
        image-ref: ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.container_tag }}
        admission-image-ref: ${{ env.ADMISSION_IMAGE_NAME }}:${{ steps.tags.outputs.container_tag }}
