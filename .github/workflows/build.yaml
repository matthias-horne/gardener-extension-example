name: Build

on:
  pull_request:
  push:
    branches:
    - main
  release:
    types:
    - published

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - run: make build
    - run: make test
    - uses: azure/setup-helm@v4.3.1
    - run: helm lint charts/gardener-extension-example

  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event.release.tag_name }}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push extension image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
          ${{ env.IMAGE_NAME }}:latest

    - name: Set up Helm
      uses: azure/setup-helm@v4.3.1

    - name: Package and push Helm chart
      shell: bash
      run: |
        chart_version="${RELEASE_TAG#v}"
        helm package charts/gardener-extension-example \
          --version "${chart_version}" \
          --app-version "${RELEASE_TAG}" \
          --destination /tmp
        printf '%s' "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
          --username "${{ github.actor }}" \
          --password-stdin
        helm push "/tmp/gardener-extension-example-${chart_version}.tgz" \
          "oci://ghcr.io/${{ github.repository_owner }}"
