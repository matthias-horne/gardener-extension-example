---
name: Manifest and compatibility artifacts
description: Pushes the extension's manifest OCI artifact and attaches compatibility information.

inputs:
  chart-ref:
    description: The extension's OCI helm chart ref.
    required: true
  extension-ref:
    description: The ref that this extension's manifest OCI artifact will be pushed to.
    required: true
  image-repository:
    description: The extension image repository.
    required: false
  image-tag:
    description: The extension image tag.
    required: false

runs:
  using: composite
  steps:
    - name: Patch extension chart ref
      uses: mikefarah/yq@v4
      with:
        cmd: yq e -i '.spec.deployment.extension.helm.ociRepository.ref = "${{ inputs.chart-ref }}"' example/extension.yaml

    - name: Patch manifest annotation
      uses: mikefarah/yq@v4
      with:
        cmd: yq e -i '.metadata.annotations."extension.garden.cloud/manifest" = "${{ inputs.extension-ref }}"' example/extension.yaml

    - name: Patch extension image values
      if: inputs.image-repository != '' && inputs.image-tag != ''
      uses: mikefarah/yq@v4
      with:
        cmd: yq e -i '(select(.spec.deployment.extension.values.image? != null) | .spec.deployment.extension.values.image.repository = "${{ inputs.image-repository }}" | .spec.deployment.extension.values.image.tag = "${{ inputs.image-tag }}") // .' example/extension.yaml

    - name: Patch runtime cluster image values
      if: inputs.image-repository != '' && inputs.image-tag != ''
      uses: mikefarah/yq@v4
      with:
        cmd: yq e -i '(select(.spec.deployment.extension.runtimeClusterValues.image? != null) | .spec.deployment.extension.runtimeClusterValues.image.repository = "${{ inputs.image-repository }}" | .spec.deployment.extension.runtimeClusterValues.image.tag = "${{ inputs.image-tag }}") // .' example/extension.yaml

    - name: Prepare compatibility information
      shell: bash
      run: |
        cp example/extension.yaml "${RUNNER_TEMP}/extension.yaml"

        gardener_version="$(awk '$1 == "github.com/gardener/gardener" { print $2 }' go.mod)"
        test -n "${gardener_version}"
        GARDENER_VERSION="${gardener_version}" yq eval \
          '.builtWith."gardener/gardener" = strenv(GARDENER_VERSION)' \
          compatibility.yaml > "${RUNNER_TEMP}/compatibility.yaml"

    - name: Set up ORAS
      uses: oras-project/setup-oras@v2

    - name: Push extension artifact
      shell: bash
      working-directory: ${{ runner.temp }}
      run: |
        oras push "${{ inputs.extension-ref }}" \
          --artifact-type application/gardener.extension+yaml \
          extension.yaml:application/gardener.extension+yaml

    - name: Attach compatibility information to extension artifact
      shell: bash
      working-directory: ${{ runner.temp }}
      run: |
        extension_name="$(echo "${{ inputs.extension-ref }}" | cut -d: -f1)"
        extension_digest="$(oras resolve "${{ inputs.extension-ref }}")"
        oras attach "${extension_name}@${extension_digest}" \
          --distribution-spec v1.1-referrers-tag \
          --artifact-type application/gardener.compatibility+yaml \
          compatibility.yaml:application/gardener.compatibility+yaml
