apiVersion: operator.gardener.cloud/v1alpha1
kind: Extension
metadata:
  annotations:
    security.gardener.cloud/pod-security-enforce: baseline
    extension.garden.cloud/manifest: ghcr.io/matthias-horne/extensions/gardener-extension-example:v0.0.2
  name: example
spec:
  deployment:
    admission:
      runtimeCluster:
        helm:
          ociRepository:
            ref: ghcr.io/matthias-horne/charts/admission-example-runtime:0.0.2
      virtualCluster:
        helm:
          ociRepository:
            ref: ghcr.io/matthias-horne/charts/admission-example-application:0.0.2
    extension:
      helm:
        ociRepository:
          ref: ghcr.io/matthias-horne/charts/gardener-extension-example:0.0.2
  resources:
  - kind: Extension
    type: example
