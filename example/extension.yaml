apiVersion: operator.gardener.cloud/v1alpha1
kind: Extension
metadata:
  annotations:
    security.gardener.cloud/pod-security-enforce: baseline
    extension.garden.cloud/manifest: ghcr.io/matthias-horne/extensions/gardener-extension-example:v0.0.2
  name: example
spec:
  deployment:
    admission:
      runtimeCluster:
        helm:
          ociRepository:
            ref: ghcr.io/matthias-horne/charts/admission-example-runtime:v0.0.2
      virtualCluster:
        helm:
          ociRepository:
            ref: ghcr.io/matthias-horne/charts/admission-example-application:v0.0.2
      values:
        image:
          repository: ghcr.io/matthias-horne/gardener-extension-admission-example
          tag: v0.0.2
          pullPolicy: IfNotPresent
    extension:
      helm:
        ociRepository:
          ref: ghcr.io/matthias-horne/charts/gardener-extension-example:v0.0.2
      runtimeClusterValues:
        image:
          repository: ghcr.io/matthias-horne/gardener-extension-example
          tag: v0.0.2
          pullPolicy: IfNotPresent
  resources:
  - kind: Extension
    type: example
